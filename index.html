<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="ISZA FAMILY - Modern Personal Finance Dashboard">
    <title>ISZA FAMILY</title>
    
    <!-- PWA Manifest & Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#adff2f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ISZA FAMILY">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- jsPDF & html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        indigo: {
                            50: '#f7ffe6',
                            100: '#ebffc2',
                            500: '#adff2f', // Hijau stabilo
                            600: '#adff2f', // Hijau stabilo
                            700: '#94e61c',
                        },
                        success: { DEFAULT: "#10b981", foreground: "#ffffff" },
                        warning: { DEFAULT: "#f59e0b", foreground: "#ffffff" }
                    }
                },
            },
        }
    </script>
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="root"></div>

    <!-- ========================================== -->
    <!-- Modular Script Loading (ORDER MATTERS!)    -->
    <!-- Layer 1: Utilities (no dependencies)       -->
    <!-- Layer 2: UI Components                     -->
    <!-- Layer 3: Custom Hooks                      -->
    <!-- Layer 4: Shared Components                 -->
    <!-- Layer 5: View Components                   -->
    <!-- Layer 6: Core App (depends on everything)  -->
    <!-- ========================================== -->

    <!-- Layer 1: Utilities -->
    <script type="text/babel" src="./utils/formatters.js?v=13"></script>
    <script type="text/babel" src="./utils/validators.js?v=13"></script>
    <script type="text/babel" src="./utils/finance.js?v=13"></script>
    <script type="text/babel" src="./utils/styles.js?v=13"></script>

    <!-- Layer 2: UI Primitives -->
    <script type="text/babel" src="./components/ui.js?v=13"></script>

    <!-- Layer 3: Custom Hooks -->
    <script type="text/babel" src="./hooks/useClickOutside.js?v=13"></script>
    <script type="text/babel" src="./hooks/useSessionManager.js?v=13"></script>
    <script type="text/babel" src="./hooks/useFinanceData.js?v=13"></script>
    <script type="text/babel" src="./hooks/useFamilyNotes.js?v=13"></script>
    <script type="text/babel" src="./hooks/usePlanning.js?v=13"></script>

    <!-- Layer 4: Shared Components -->
    <script type="text/babel" src="./components/FilterDropdown.js?v=13"></script>
    <script type="text/babel" src="./components/TransactionItem.js?v=13"></script>

    <!-- Layer 5: View Components -->
    <script type="text/babel" src="./views/LoginPage.js?v=13"></script>
    <script type="text/babel" src="./views/DashboardView.js?v=13"></script>
    <script type="text/babel" src="./views/TransactionsView.js?v=13"></script>
    <script type="text/babel" src="./views/FamilyNotesView.js?v=13"></script>
    <script type="text/babel" src="./views/CategoriesView.js?v=13"></script>
    <script type="text/babel" src="./views/SettingsView.js?v=13"></script>

    <!-- Config (Loaded before app.js) -->
    <script src="./config.js?v=13"></script>
    
    <!-- Layer 6: Core App (must be last) -->
    <script type="text/babel" src="./app.js?v=13"></script>
</body>
</html>
